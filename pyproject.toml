[project.urls]
Homepage = "https://github.com/kartoza/django-bims"
Documentation = "https://github.com/kartoza/django-bims#readme"
Repository = "https://github.com/kartoza/django-bims.git"
Issues = "https://github.com/kartoza/django-bims/issues"

[tool.uv]
# Django project, not an installable package: only sync its dependencies.
package = false

[tool.uv.sources]
django-celery-beat = { git = "https://github.com/celery/django-celery-beat", rev = "bd429063cbb227c00905e7693c38895e44ff8e47" }
cloud-native-gis = { git = "https://github.com/kartoza/CloudNativeGIS.git", rev = "0.0.5bims" }

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | static
    | media
    | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "venv", "migrations", "static", "media", "node_modules"]
known_django = ["django"]
known_third_party = ["rest_framework", "celery", "geonode"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["bims", "core"]
addopts = [
    "--strict-markers",
    "-ra",
    "-q",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["bims", "core"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/admin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 50
show_missing = true

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests", "migrations"]
skips = ["B101", "B104", "B311"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "migrations",
    ".venv",
    "venv",
]

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "django-debug-toolbar==4.4.2",
    "factory-boy==2.12.0",
    "flake8==3.8.1",
    "pdbpp>=0.12.1",
    "pep8>=1.5.7,<1.6",
    "pylint==3.0.3",
    "selenium==4.14.0",
    "watchdog>=3.0.0",
    "wrapt==1.16.0",
]
