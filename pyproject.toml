# Python project configuration for Django BIMS

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-bims"
version = "1.0.0"
description = "Biodiversity Information Management System"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = "==3.12.*"
authors = [
    {name = "Kartoza", email = "info@kartoza.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "bibtexparser==1.1.0",
    "celery==5.3.6",
    "cloud-native-gis",
    "dj-database-url==0.5.0",
    "dj-pagination==2.5.0",
    "django==6.0.8",
    "django-admin-inline-paginator==0.4.0",
    "django-admin-rangefilter==0.13.3",
    "django-allauth==65.14.1",
    "django-autocomplete-light==3.12.1",
    "django-braces==1.14.0",
    "django-celery-beat",
    "django-celery-results==2.5.1",
    "django-ckeditor==6.6.1",
    "django-colorfield==0.9.0",
    "django-contact-us==0.4.3",
    "django-cors-headers==4.3.1",
    "django-crispy-forms==1.9.1",
    "django-cryptography-5==2.0.3",
    "django-easy-audit==1.3.9a1",
    "django-extensions==3.2.3",
    "django-filter==23.5",
    "django-forms-bootstrap==3.1.0",
    "django-grappelli==4.0.3",
    "django-guardian==2.3.0",
    "django-imagekit==4.0.2",
    "django-invitations==2.0.0",
    "django-json-widget==1.1.1",
    "django-model-utils==4.0.0",
    "django-modelsdoc==0.1.11",
    "django-modeltranslation==0.16.2",
    "django-mptt==0.18.0",
    "django-ordered-model==3.7.4",
    "django-pipeline==2.1.0",
    "django-polymorphic==3.1.0",
    "django-preferences==1.0.0",
    "django-prometheus==2.0.0",
    "django-role-permissions==2.2.1",
    "django-sentry==1.13.5",
    "django-taggit==5.0.1",
    "django-tenants==3.10.0",
    "django-treebeard==4.7",
    "django-uuid-upload-path==1.0.0",
    "django-webpack-loader==1.3.0",
    "djangorestframework==3.15.2",
    "djangorestframework-gis==1.0",
    "djangorestframework-guardian==0.3.0",
    "drf-nested-routers==0.93.5",
    "drf-yasg==1.21.15",
    "eutils==0.6.0",
    "geoalchemy2==0.15.1",
    "geopandas==1.1.2",
    "geopy==2.0.0",
